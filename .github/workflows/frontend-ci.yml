name: Frontend CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master"]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API schema
        run: pnpm generate:api

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build web
        run: pnpm build:web

      - name: Build mobile
        run: pnpm build:mobile
